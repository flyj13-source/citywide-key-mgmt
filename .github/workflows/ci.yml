name: CI

# Runs the Tier 1 API integration suite on every push and PR. A regression
# turns the commit's check red. Point Render's Auto-Deploy at "wait for CI to
# pass" so a red X blocks the deploy BEFORE it ships.
on:
  push:
  pull_request:

jobs:
  tier1-api-tests:
    name: Tier 1 — API integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is available without a flag on Node 24+.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check / build
        run: npm run build

      - name: Run Tier 1 suite
        run: npm test
