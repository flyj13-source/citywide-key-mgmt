name: CI

# Runs the API integration suite + the data-survival suite (Layer 2) on every
# push and PR. A regression turns the commit's check red. Point Render's
# Auto-Deploy at "wait for CI to pass" so a red X blocks the deploy BEFORE it
# ships.
on:
  push:
  pull_request:

jobs:
  tests:
    name: API + data-survival tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is available without a flag on Node 24+.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check / build
        run: npm run build

      - name: Run test suite (API + data-survival)
        run: npm test
