services:
  - type: web
    name: citywide-backend
    runtime: node
    rootDir: backend
    # --include=dev so tsc + @types are present even with NODE_ENV=production.
    # NO seed here — seeding runs at runtime on boot (autoSeedIfEmpty), otherwise
    # `npm run seed` would try to mkdir the /data mount before it exists at build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    # Persistent disk — WITHOUT this the SQLite file lives on ephemeral storage
    # and every deploy/restart wipes all data. DB_PATH points the app + seed at
    # the mounted disk; the boot self-check verifies it landed there.
    disk:
      name: citywide-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/citywide.db
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TEAMS_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
