# SUPERSEDED by the root render.yaml blueprint, which defines this backend
# service alongside the other so the two deploy in lockstep. Render only
# reads a blueprint at the REPOSITORY ROOT, so this file was never active.
# Kept for reference; edit the root render.yaml instead.
# ─────────────────────────────────────────────────────────────────────────────
# Shared backup secrets — set ONCE here, referenced by both the web service and
# the cron job (so BACKUP_TRIGGER_TOKEN matches on both sides). Fill these in the
# Render dashboard under Env Groups → citywide-backup-secrets.
# ─────────────────────────────────────────────────────────────────────────────
envVarGroups:
  - name: citywide-backup-secrets
    envVars:
      # openssl rand -hex 32  — encrypts every backup artifact at rest
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # openssl rand -hex 32  — shared secret gating POST /api/backups/run
      - key: BACKUP_TRIGGER_TOKEN
        sync: false
      # S3-compatible object storage (Cloudflare R2 recommended)
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_ALERT_EMAIL
        sync: false

services:
  # ── Web service (owns the persistent disk; runs the actual backup) ──────────
  - type: web
    name: citywide-backend
    runtime: node
    rootDir: backend
    # --include=dev so tsc + @types are present even with NODE_ENV=production.
    # NO seed here — seeding runs at runtime on boot (autoSeedIfEmpty), otherwise
    # `npm run seed` would try to mkdir the /data mount before it exists at build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    # Persistent disk — WITHOUT this the SQLite file lives on ephemeral storage
    # and every deploy/restart wipes all data. DB_PATH points the app + seed at
    # the mounted disk; the boot self-check verifies it landed there.
    #
    # NOTE: a Render disk attaches to EXACTLY ONE service. That's why the backup
    # runs inside THIS service (which can read /data/citywide.db) and the cron
    # job below only TRIGGERS it over HTTP — a separate cron service cannot mount
    # this disk.
    disk:
      name: citywide-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - fromGroup: citywide-backup-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/citywide.db
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Second recipient on every key check-out / check-in email (with the
      # holder). Falls back to SMTP_USER when unset.
      - key: CARA_EMAIL
        sync: false
      - key: TEAMS_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Scheduled backup trigger (cron) ─────────────────────────────────────────
  # Runs daily at 06:00 UTC = 02:00 America/New_York during EDT (Mar–Nov), 01:00
  # during EST (Render cron is UTC-only; either way it's the overnight low-traffic
  # window). It holds NO disk and NO S3 creds — it just POSTs to the web service,
  # which performs the snapshot/upload. Exits non-zero (red in the dashboard) if
  # the backup reports failure.
  - type: cron
    name: citywide-backup-cron
    runtime: node
    rootDir: backend
    schedule: "0 6 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/scripts/trigger-backup.js
    envVars:
      - fromGroup: citywide-backup-secrets
      - key: BACKUP_TRIGGER_URL
        value: https://citywide-backend-0xuj.onrender.com/api/backups/run
